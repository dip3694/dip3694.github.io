name: Build APK

on:
  workflow_dispatch:
    inputs:
      site_address:
        description: "Website address (without https://)"
        required: true
        default: "dip3694.github.io"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Read site icon from manifest
        env:
          SITE: ${{ github.event.inputs.site_address }}
        run: |
          ICON=$(curl -fsSL "https://$SITE/manifest.json" | jq -r '
            [.icons[]
              | {src: .src,
                 px: ((.sizes // "0x0") | split("x")[0] | (tonumber? // 0))}]
            | max_by(.px).src')
          if [ -z "$ICON" ] || [ "$ICON" = "null" ]; then
            echo "No usable icon found in https://$SITE/manifest.json"
            exit 1
          fi
          case "$ICON" in
            /*) ICON="https://$SITE$ICON" ;;
            http*) ;;
            *) ICON="https://$SITE/$ICON" ;;
          esac
          echo "ICON=$ICON" | tee -a "$GITHUB_ENV"

      - name: Create signing key and TWA manifest
        env:
          SITE: ${{ github.event.inputs.site_address }}
        run: |
          mkdir twa
          cd twa
          keytool -genkeypair -v -keystore android.keystore \
            -alias android -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass moneytracker -keypass moneytracker \
            -dname "CN=Money Tracker, OU=Apps, O=Dip, C=IN"
          jq -n \
            --arg site "$SITE" \
            --arg icon "$ICON" \
            '{
              packageId: "com.dip3694.moneytracker",
              host: $site,
              name: "Money Tracker",
              launcherName: "Money Tracker",
              display: "standalone",
              themeColor: "#4F46E5",
              themeColorDark: "#111827",
              navigationColor: "#FFFFFF",
              navigationColorDark: "#111827",
              navigationDividerColor: "#FFFFFF",
              navigationDividerColorDark: "#111827",
              backgroundColor: "#FFFFFF",
              iconUrl: $icon,
              webManifestUrl: ("https://" + $site + "/manifest.json"),
              shortcuts: [],
              signingKey: {
                path: "android.keystore",
                alias: "android",
                password: "moneytracker",
                keyPassword: "moneytracker"
              },
              appVersionName: "1.0.0",
              appVersionCode: 1,
              minSdkVersion: 19,
              orientation: "default",
              fallbackType: "customtabs",
              enableNotifications: false,
              enableSiteSettingsShortcut: true,
              splashScreenFadeOutDuration: 300,
              generatorApp: "Bubblewrap",
              alphaDependencies: {enabled: false},
              isChromeOSOnly: false,
              isMetaQuest: false,
              retainedBundles: [],
              additionalTrustedOrigins: [],
              fingerprints: []
            }' | tee twa-manifest.json

      - name: Build APK and assetlinks.json
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: moneytracker
          BUBBLEWRAP_KEY_PASSWORD: moneytracker
        run: |
          cd twa
          bubblewrap build --skipPwaValidation
          ls -la

      - name: Collect outputs
        run: |
          mkdir -p output
          cp twa/app-release-signed.apk output/MoneyTracker.apk
          cp twa/assetlinks.json output/assetlinks.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: output/
